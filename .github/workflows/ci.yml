name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-structure:
    name: Lint & Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Structure + syntax check
        # test:syntax runs validate-structure.mjs first, so one step covers both.
        run: npm run test:syntax

  test-core:
    name: Core (${{ matrix.node }}) (contracts / memory / runners / semi-auto / judge / attestation / fixtures / cases / prototype / reporting / revision)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor (import.meta.dirname needs >=20.11); 22 guards
        # the current LTS line.
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: test:contracts
        run: npm run test:contracts

      - name: test:memory
        run: npm run test:memory

      - name: test:runners
        run: npm run test:runners

      - name: test:semi-auto
        run: npm run test:semi-auto

      - name: test:evaluators
        run: npm run test:evaluators

      - name: test:judge
        run: npm run test:judge

      - name: test:attestation
        run: npm run test:attestation

      - name: test:fixtures
        run: npm run test:fixtures

      - name: test:cases
        run: npm run test:cases

      - name: test:prototype
        run: npm run test:prototype

      - name: test:reporting
        run: npm run test:reporting

      - name: test:revision
        run: npm run test:revision

  test-e2e:
    name: End-to-end harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: test:e2e
        run: npm run test:e2e

  test-smoke-flow:
    name: Dev smoke-flow (no real model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: test:smoke-flow
        run: npm run test:smoke-flow

  test-browser:
    name: Browser evidence (Playwright/Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: test:browser
        run: npm run test:browser
