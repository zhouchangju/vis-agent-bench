# Codex 预设：GPT-5.6 Luna，最大思考强度（对应 xhigh）。
# 真实运行需 --acknowledge-no-cost-cap（Codex 无原生费用上限）。
schema_version: 2
name: codex-gpt-5.6-luna-xhigh
case_id: narrative-equity-relationship

engine:
  adapter: codex-cli
  executable: codex
  configured_model: gpt-5.6-luna
  reasoning_effort: xhigh
  provider: openai-codex-configured-provider
  credential_ref: secret://codex/default

isolation:
  mode: file-isolated-development
  leaderboard_eligible: false
  network: enabled
  block_internal_network: false
  inherited_home_for_auth: true
  answer_leakage_scan: true
  workspace_root: .local/runs

permissions:
  read_internal_source: false
  read_answer_repository: false
  hidden_evaluator_visible: false
  allowed_tools:
    - shell
    - file_read
    - file_write
    - public_web

budget:
  wall_time_minutes: 180
  max_retries: 1
  max_tokens: null
  max_cost_usd: null

scenario:
  mode: progressive-disclosure
  baseline_type: current-ai-assisted-workflow
  session_continuity_required: true

evidence:
  raw_stdout: true
  raw_stderr: true
  normalized_events: true
  file_snapshots: true
  git_diff: true
  screenshots: true
  redact_secrets: true
  human_review_required: true
