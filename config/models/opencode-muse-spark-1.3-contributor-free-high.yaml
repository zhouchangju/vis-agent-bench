# OpenCode 预设：Muse Spark 1.3 Contributor Free，high 推理强度。
# 真实运行需 --acknowledge-no-cost-cap（OpenCode 无原生费用上限）。
schema_version: 2
name: opencode-muse-spark-1.3-contributor-free-high
case_id: narrative-equity-relationship

engine:
  adapter: opencode-cli
  executable: opencode
  configured_model: opencode/muse-spark-1.3-contributor-free
  reasoning_effort: high
  provider: opencode
  credential_ref: secret://opencode/default

isolation:
  mode: file-isolated-development
  leaderboard_eligible: false
  network: enabled
  block_internal_network: false
  inherited_home_for_auth: true
  answer_leakage_scan: true
  workspace_root: .local/runs

permissions:
  read_internal_source: false
  read_answer_repository: false
  hidden_evaluator_visible: false
  allowed_tools:
    - shell
    - file_read
    - file_write
    - public_web

budget:
  wall_time_minutes: 180
  max_retries: 1
  max_tokens: null
  max_cost_usd: null

scenario:
  mode: progressive-disclosure
  baseline_type: current-ai-assisted-workflow
  session_continuity_required: true

evidence:
  raw_stdout: true
  raw_stderr: true
  normalized_events: true
  file_snapshots: true
  git_diff: true
  screenshots: true
  redact_secrets: true
  human_review_required: true
