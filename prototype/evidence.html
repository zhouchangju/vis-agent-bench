<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vis Agent Bench · Evidence Viewer</title>
  <link rel="stylesheet" href="./assets/prototype.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">VAB</span>Vis Agent Bench</a>
      <nav class="nav" aria-label="Prototype pages">
        <a href="./setup.html">运行设置</a>
        <a href="./runs.html">Run 状态</a>
        <a href="./evidence.html" class="active">证据查看</a>
        <a href="./compare.html">横向对比</a>
        <a href="./review.html">人工评审</a>
        <a href="./report.html">领导报告</a>
      </nav>
      <div class="top-meta">EVIDENCE / PROTOTYPE</div>
    </header>

    <div class="demo-ribbon"><b>SAMPLE DATA</b> 示例数据，非真实评测结果。证据文件均为占位摘要。</div>

    <div id="run-selector-section" style="padding:28px 0 18px">
      <div class="eyebrow">Evidence for a specific run</div>
      <h1 style="font-size:clamp(34px,4vw,58px)">证据查看</h1>
      <p style="color:var(--muted)">机器负责留证据，人负责判断是否真的可用。选择 Run 后按证据类型切换查看。</p>
      <div style="display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:300px">
          <label for="run-id-input">Run ID</label>
          <input id="run-id-input" placeholder="输入 run-id 或从 Run 状态页跳转" autocomplete="off">
        </div>
        <button class="primary" id="btn-load" onclick="loadRun()" style="margin-top:22px">加载证据</button>
      </div>
      <p style="color:var(--faint);font-size:11px;margin-top:8px" id="quick-links">快速加载：</p>
    </div>

    <div id="evidence-content" style="display:none">
      <div class="report-hero" style="padding:28px 0">
        <div class="verdict" style="min-height:auto">
          <span class="status good" id="ev-run-status">loaded</span>
          <h1 style="font-size:clamp(28px,4vw,46px)" id="ev-run-label">—</h1>
          <p id="ev-run-summary" style="color:var(--muted)">—</p>
        </div>
        <aside class="decision-panel" style="min-height:auto">
          <div>
            <div class="eyebrow">Run info</div>
            <div style="display:grid;gap:8px;font-size:13px" id="ev-run-info"></div>
          </div>
        </aside>
      </div>

      <div class="tab-bar" id="tab-bar">
        <button class="tab active" data-tab="build">Build / Test</button>
        <button class="tab" data-tab="browser">Browser</button>
        <button class="tab" data-tab="diff">Workspace Diff</button>
        <button class="tab" data-tab="attestation">Attestation</button>
        <button class="tab" data-tab="review">Human Review</button>
      </div>

      <div class="tab-content active" id="tab-build"></div>
      <div class="tab-content" id="tab-browser"></div>
      <div class="tab-content" id="tab-diff"></div>
      <div class="tab-content" id="tab-attestation"></div>
      <div class="tab-content" id="tab-review"></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="./assets/utils.js"></script>
  <script src="./assets/sample-runs.js"></script>
  <script>
    var currentRunId = null;

    function init() {
      var params = new URLSearchParams(window.location.search);
      var runId = params.get('run');
      if (runId) {
        document.getElementById('run-id-input').value = runId;
        loadRun();
      }
      renderQuickLinks();
    }

    function renderQuickLinks() {
      var links = document.getElementById('quick-links');
      var runs = getAllRuns();
      var html = '快速加载：';
      runs.forEach(function(r) {
        html += ' <a href="?run=' + encodeURIComponent(r.run_id) + '" style="color:var(--cyan);text-decoration:underline;cursor:pointer">' + escapeHtml(r.run_id) + '</a> &nbsp;';
      });
      links.innerHTML = html;
    }

    function loadRun() {
      var runId = document.getElementById('run-id-input').value.trim();
      if (!runId) {
        showToast('请输入 Run ID');
        return;
      }
      var run = getRunById(runId);
      if (!run) {
        showToast('Run ' + runId + ' 不存在');
        return;
      }
      currentRunId = runId;
      localStorage.setItem('vab-current-run', runId);

      // Update URL
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', '?run=' + encodeURIComponent(runId));
      }

      // Show evidence section
      document.getElementById('evidence-content').style.display = 'block';

      // Update header
      var sc = statusClass(run.status);
      document.getElementById('ev-run-status').textContent = run.status;
      document.getElementById('ev-run-status').className = 'status ' + sc;
      document.getElementById('ev-run-label').textContent = run.case_name + ' / ' + run.engine + ' ' + run.model;
      document.getElementById('ev-run-summary').textContent = 'Case ' + run.case_id + ' · 阶段 ' + run.scenario.completed_stages.length + '/' + run.scenario.stage_ids.length;
      document.getElementById('ev-run-info').innerHTML =
        '<div><b style="color:var(--muted)">开始时间</b> ' + (run.started_at ? escapeHtml(new Date(run.started_at).toLocaleString()) : '&mdash;') + '</div>' +
        '<div><b style="color:var(--muted)">完成时间</b> ' + (run.completed_at ? escapeHtml(new Date(run.completed_at).toLocaleString()) : '&mdash;') + '</div>' +
        '<div><b style="color:var(--muted)">隔离模式</b> ' + (run.isolation ? escapeHtml(run.isolation.mode) : '&mdash;') + '</div>' +
        '<div><b style="color:var(--muted)">Provider</b> ' + (run.provider ? escapeHtml(run.provider) : '&mdash;') + '</div>';

      // Render evidence tabs
      var ev = getEvidence(currentRunId);
      if (ev) {
        renderBuildTab(ev);
        renderBrowserTab(ev);
        renderDiffTab(ev);
        renderAttestationTab(ev);
      }
      renderReviewTab(run);

      // Reset to first tab
      switchTab('build');
    }

    function statusClass(status) {
      if (status === 'completed' || status === 'success') return 'good';
      if (status === 'running') return 'info';
      if (status === 'awaiting-evaluation' || status === 'awaiting-human-review') return 'warn';
      if (status === 'failed') return 'bad';
      return '';
    }

    function exitIcon(code) {
      if (code === 0) return '<span style="color:var(--acid);font-size:16px">&#10004;</span>';
      if (code == null) return '<span style="color:var(--faint);font-size:16px">&#9679;</span>';
      return '<span style="color:var(--red);font-size:16px">&#10008;</span>';
    }

    function formatMs(ms) {
      if (ms == null) return '&mdash;';
      var s = Math.round(ms / 1000);
      if (s < 60) return s + 's';
      return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
    }

    function formatBytes(bytes) {
      if (bytes == null) return '&mdash;';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function renderBuildTab(ev) {
      if (!ev.commands || ev.commands.length === 0) {
        document.getElementById('tab-build').innerHTML = '<div class="empty-state"><p>&#128264; 暂无构建/测试记录</p></div>';
        return;
      }
      var html = '<div class="evidence-section-desc">记录每个阶段的 CLI 执行结果：exit code、耗时、参数。</div>';
      html += '<div class="ev-table-wrap"><table class="matrix"><thead><tr><th>阶段</th><th>可执行文件</th><th>Exit</th><th>耗时</th><th>参数</th></tr></thead><tbody>';
      ev.commands.forEach(function(cmd) {
        html += '<tr>' +
          '<td style="font-family:var(--mono);color:var(--acid)">' + (cmd.stage_id ? escapeHtml(cmd.stage_id) : '&mdash;') + '</td>' +
          '<td style="font-family:var(--mono)">' + escapeHtml(cmd.executable || '') + '</td>' +
          '<td>' + exitIcon(cmd.exit_code) + ' ' + (cmd.exit_code != null ? escapeHtml(cmd.exit_code) : '&mdash;') + '</td>' +
          '<td style="font-family:var(--mono);font-size:11px">' + formatMs(cmd.duration_ms) + '</td>' +
          '<td style="font-family:var(--mono);font-size:10px;color:var(--muted)">' + escapeHtml(cmd.args || '') + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('tab-build').innerHTML = html;
    }

    function renderBrowserTab(ev) {
      if (!ev.browser) {
        document.getElementById('tab-browser').innerHTML = '<div class="empty-state"><p>&#128264; 暂无浏览器证据</p></div>';
        return;
      }
      var b = ev.browser;
      var html = '';

      // Screenshots
      html += '<h3 style="margin-top:0;font-family:var(--display);font-size:18px">截图</h3>';
      if (b.screenshots && b.screenshots.length > 0) {
        html += '<div class="browser-thumb-grid">';
        b.screenshots.forEach(function(shot) {
          var safeLabel = escapeHtml(shot.label || '');
          html += '<div class="browser-thumb">' +
            '<div class="thumb-placeholder">' + safeLabel.substr(0,2) + '</div>' +
            '<div class="thumb-label">' + safeLabel + '</div>' +
            '<div class="thumb-size">' + formatBytes(shot.size_bytes) + '</div>' +
          '</div>';
        });
        html += '</div>';
      } else {
        html += '<p style="color:var(--faint);font-size:12px">暂无截图（运行未完成浏览器阶段）。</p>';
      }

      // DOM Snapshots
      html += '<h3 style="margin-top:24px;font-family:var(--display);font-size:18px">DOM 快照</h3>';
      if (b.dom_snapshots && b.dom_snapshots.length > 0) {
        html += '<div class="ev-table-wrap"><table class="matrix"><thead><tr><th>标签</th><th>文件</th><th>大小</th><th>节点数</th></tr></thead><tbody>';
        b.dom_snapshots.forEach(function(snap) {
          html += '<tr>' +
            '<td>' + escapeHtml(snap.label || '') + '</td>' +
            '<td style="font-family:var(--mono);font-size:11px">' + escapeHtml(snap.filename || '') + '</td>' +
            '<td style="font-family:var(--mono)">' + formatBytes(snap.size_bytes) + '</td>' +
            '<td style="font-family:var(--mono)">' + (snap.node_count != null ? Number(snap.node_count) : '&mdash;') + '</td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      } else {
        html += '<p style="color:var(--faint);font-size:12px">暂无 DOM 快照。</p>';
      }

      // Console summary
      html += '<h3 style="margin-top:24px;font-family:var(--display);font-size:18px">控制台</h3>';
      html += '<div class="ev-stats-grid">' +
        '<div class="run-stat"><label>Console Errors</label><span style="color:' + (b.console_errors > 0 ? 'var(--red)' : 'var(--acid)') + '">' + (b.console_errors != null ? Number(b.console_errors) : 'N/A') + '</span></div>' +
        '<div class="run-stat"><label>Console Warnings</label><span style="color:' + (b.console_warnings > 0 ? 'var(--amber)' : 'var(--acid)') + '">' + (b.console_warnings != null ? Number(b.console_warnings) : 'N/A') + '</span></div>' +
      '</div>';

      document.getElementById('tab-browser').innerHTML = html;
    }

    function renderDiffTab(ev) {
      if (!ev.workspace_diff) {
        document.getElementById('tab-diff').innerHTML = '<div class="empty-state"><p>&#128264; 暂无工作区差异（运行未完成或未生成 diff）。</p></div>';
        return;
      }
      var d = ev.workspace_diff;
      var html = '<div class="evidence-section-desc">工作区文件变更摘要</div>';
      html += '<div class="ev-stats-grid" style="margin-bottom:18px">' +
        '<div class="run-stat"><label>文件变更</label><span>' + Number(d.files_changed || 0) + '</span></div>' +
        '<div class="run-stat"><label>新增文件</label><span style="color:var(--acid)">' + Number(d.files_added || 0) + '</span></div>' +
        '<div class="run-stat"><label>删除文件</label><span style="color:var(--red)">' + Number(d.files_deleted || 0) + '</span></div>' +
        '<div class="run-stat"><label>行变更</label><span>+' + Number(d.lines_added || 0) + ' / -' + Number(d.lines_deleted || 0) + '</span></div>' +
      '</div>';
      html += '<h3 style="font-family:var(--display);font-size:18px">Diff 预览</h3>';
      html += '<pre class="manifest" style="max-height:420px;white-space:pre-wrap">' + escapeHtml(d.summary || '') + '</pre>';
      document.getElementById('tab-diff').innerHTML = html;
    }

    function renderAttestationTab(ev) {
      if (!ev.attestation) {
        document.getElementById('tab-attestation').innerHTML = '<div class="empty-state"><p>&#128264; 暂无 Attestation 数据。</p></div>';
        return;
      }
      var a = ev.attestation;
      var html = '<div class="evidence-section-desc">文件哈希绑定（SHA-256），用于验证证据未被篡改。</div>';
      html += '<div class="run-stats-grid" style="margin-bottom:18px">' +
        '<div class="run-stat"><label>验证状态</label><span style="color:' + (a.verified ? 'var(--acid)' : 'var(--red)') + '">' + (a.verified ? '已验证' : '验证失败') + '</span></div>' +
        '<div class="run-stat"><label>Bindings</label><span>' + (a.bindings ? a.bindings.length : 0) + '</span></div>' +
      '</div>';
      html += '<div class="ev-table-wrap"><table class="matrix"><thead><tr><th>阶段</th><th>算法</th><th>哈希</th><th>文件</th></tr></thead><tbody>';
      (a.bindings || []).forEach(function(b) {
        html += '<tr>' +
          '<td style="font-family:var(--mono);color:var(--acid)">' + escapeHtml(b.stage_id || '') + '</td>' +
          '<td style="font-family:var(--mono);font-size:11px">' + escapeHtml(b.algorithm || '') + '</td>' +
          '<td style="font-family:var(--mono);font-size:10px;color:var(--muted)">' + escapeHtml(b.sha256 || '') + '</td>' +
          '<td style="font-family:var(--mono);font-size:10px">' + escapeHtml(b.file || '') + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('tab-attestation').innerHTML = html;
    }

    function renderReviewTab(run) {
      var status = run.human_review_status || 'pending';
      var icon, color;
      if (status === 'approved') { icon = '&#10004;'; color = 'var(--acid)'; }
      else if (status === 'rejected') { icon = '&#10008;'; color = 'var(--red)'; }
      else { icon = '&#9679;'; color = 'var(--amber)'; }

      var html = '<div class="empty-state" style="text-align:center;padding:48px 24px">' +
        '<div style="font-size:48px;margin-bottom:16px;color:' + color + '">' + icon + '</div>' +
        '<h3 style="font-family:var(--display);font-size:22px;margin-bottom:8px">评审状态：' + escapeHtml(status) + '</h3>';
      if (status === 'pending') {
        html += '<p style="color:var(--muted)">尚未进行人工评审。</p>' +
          '<a class="primary" href="./review.html" style="display:inline-flex;align-items:center;text-decoration:none;margin-top:16px">前往人工评审 &#8594;</a>';
      } else if (status === 'approved') {
        html += '<p style="color:var(--acid)">已通过人工评审。</p>';
      } else {
        html += '<p style="color:var(--red)">已被驳回，需修复后重新评审。</p>';
      }
      html += '</div>';
      document.getElementById('tab-review').innerHTML = html;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      var tabBtn = document.querySelector('.tab[data-tab="' + tabName + '"]');
      if (tabBtn) tabBtn.classList.add('active');
      var panel = document.getElementById('tab-' + tabName);
      if (panel) panel.classList.add('active');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    document.getElementById('tab-bar').addEventListener('click', function(e) {
      if (e.target.classList.contains('tab')) {
        switchTab(e.target.getAttribute('data-tab'));
      }
    });

    // Enter key to load
    document.getElementById('run-id-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') loadRun();
    });

    init();
  </script>
  <style>
    .evidence-section-desc {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .tab {
      padding: 12px 20px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      background: none;
      font-family: var(--body);
      font-size: 13px;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active {
      color: var(--acid);
      border-bottom-color: var(--acid);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .ev-table-wrap {
      overflow: auto;
      max-height: 520px;
      border: 1px solid var(--line);
    }
    .ev-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .run-stat {
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .run-stat label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .run-stat span {
      font-family: var(--mono);
      font-size: 14px;
    }
    .empty-state {
      padding: 36px 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      text-align: center;
      color: var(--muted);
    }
    .empty-state p { font-size: 13px; }
    .browser-thumb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .browser-thumb {
      border: 1px solid var(--line);
      background: var(--panel-2);
      text-align: center;
      overflow: hidden;
    }
    .thumb-placeholder {
      height: 120px;
      display: grid;
      place-items: center;
      font-family: var(--display);
      font-size: 32px;
      font-weight: 800;
      color: var(--faint);
      background:
        repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(108,229,232,.06) 4px, rgba(108,229,232,.06) 8px);
    }
    .thumb-label {
      padding: 10px 8px 4px;
      font-size: 12px;
      color: var(--ink);
    }
    .thumb-size {
      padding: 0 8px 10px;
      font-size: 10px;
      color: var(--faint);
      font-family: var(--mono);
    }
    @media (max-width: 720px) {
      .ev-stats-grid, .browser-thumb-grid { grid-template-columns: repeat(2, 1fr); }
      .tab { padding: 10px 12px; font-size: 11px; }
    }
  </style>
</body>
</html>
