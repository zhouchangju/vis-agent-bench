answers:
  data_scale: "正式数据为 1481 个节点、2106 条边；另提供约 200 节点开发样本。"
  layout_stability: "同一数据和配置重复加载时位置必须稳定。"
  browser_scope: "以当前 Chrome、Safari 为主，移动端至少覆盖 iPhone 尺寸。"
  visual_reference: "提供关键状态参考图，但不要求逐像素复制技术实现。"
  performance_target: "具体阈值由统一测试机基线确定；不得通过删减数据规避。"
  networking: "允许联网查文档，但运行验收使用本地 fixture。"
  existing_source: "不提供现有 3D 实现源码。"
  rotation_axis: "用户拖动旋转围绕场景纵轴（世界 Y 轴）进行，相机或控制器不得在拖动结束后产生额外偏轴或镜头倾斜，避免出现可感知的旋转偏移。"
  auto_rotation_pause_rules: "默认缓慢自转；指针悬停在节点上时暂停，离开节点后恢复；用户拖动、缩放或选择操作期间暂停，操作结束并经过短空闲窗口后再恢复。不得使用导致悬停期间仍旋转或离开后不恢复的防抖策略。"
  zoom_range: "相机距离存在合理上下限：最近不得让节点溢出视口或穿透相机，最远不得让节点缩小到无法辨认；区间由实现给出并在 README 说明，外部传入的可见区域偏移不能破坏该范围。"
  sphere_surface: "内外层球面表面仅承担空间层次表达，不得叠加多余纹理、贴图或装饰；节点、标签和关系必须保持主视觉权重。"
